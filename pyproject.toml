[project]
name = "triage-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "steve ‎", email = "176925833+mr-steveryan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
